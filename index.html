<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Task Logger | Modern Stack Starter</title>
  
  <!-- 1. นำเข้าฟอนต์ภาษาไทย Prompt จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 2. นำเข้า Tailwind CSS สำหรับจัดหน้าจอตามระบบ 8pt Grid -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 3. นำเข้า SweetAlert2 สำหรับแจ้งเตือนสวยงามแทน alert() ดั้งเดิม -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- 4. นำเข้า Supabase JS Client (ทำหน้าที่แทน google.script.run) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            // ทฤษฎีสี 60-30-10
            bgMain: '#F8FAFC',      // 60% พื้นหลังหลัก (เทาอมฟ้าอ่อนสบายตา)
            cardBg: '#FFFFFF',      // 30% พื้นหลังการ์ด
            borderSub: '#E2E8F0',   // 30% เส้นขอบรอง
            primary: '#2563EB',     // 10% สีปุ่มหลัก (น้ำเงินมาตรฐานสากล)
            success: '#10B981',     // 10% สีเขียวสำเร็จ
            warning: '#F59E0B',     // 10% สีเหลืองแจ้งเตือน
            danger: '#EF4444',      // 10% สีแดงลบ/อันตราย
          }
        }
      }
    }
  </script>
</head>

<!-- พื้นหลัง 60% (#F8FAFC) และระยะห่างตามระบบ 8pt Grid (p-4 = 16px, md:p-8 = 32px) -->
<body class="bg-bgMain text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- ส่วนหัวของระบบ (Header Card) -->
    <header class="bg-cardBg border border-borderSub rounded-xl p-6 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-blue-50 text-primary mb-2">
          <span class="w-2 h-2 rounded-full bg-success animate-pulse"></span>
          Supabase + GitHub + Vercel
        </span>
        <h1 class="text-xl md:text-2xl font-bold text-slate-900">ระบบบันทึกงานด่วน (Task Logger)</h1>
        <p class="text-sm text-slate-500 mt-1">โปรเจกต์แรกสู่โครงสร้างฐานข้อมูลระดับสากล</p>
      </div>
      
      <!-- ปุ่มรีเฟรชข้อมูล (ความสูง 40px = h-10) -->
      <button 
        id="btnRefresh" 
        onclick="fetchTasks()" 
        class="h-10 px-4 rounded-lg border border-borderSub bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 text-sm font-medium transition-all flex items-center justify-center gap-2 shadow-sm disabled:opacity-50"
      >
        <svg id="refreshIcon" class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>รีเฟรชข้อมูล</span>
      </button>
    </header>

    <!-- ส่วนฟอร์มบันทึกข้อมูล (Input Form Card) -->
    <section class="bg-cardBg border border-borderSub rounded-xl p-6 shadow-sm">
      <h2 class="text-base font-semibold text-slate-800 mb-4">เพิ่มรายการงานใหม่</h2>
      
      <form id="taskForm" onsubmit="handleAddTask(event)" class="flex flex-col sm:flex-row gap-4">
        <!-- ช่องกรอกข้อมูล ความสูง 44px (h-11) -->
        <input 
          type="text" 
          id="taskInput" 
          placeholder="พิมพ์ชื่องานที่ต้องการบันทึก เช่น ตรวจสอบฐานข้อมูลประจำวัน..." 
          class="flex-1 h-11 px-4 rounded-lg border border-borderSub bg-white text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
        />
        
        <!-- ปุ่มหลัก ความสูง 44px (h-11) มีครบทุกสถานะ + Loading Spinner -->
        <button 
          type="submit" 
          id="btnSubmit"
          class="h-11 px-6 rounded-lg bg-primary hover:bg-blue-700 active:bg-blue-800 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-sm font-medium transition-all flex items-center justify-center gap-2 shadow-sm shrink-0"
        >
          <!-- ไอคอน Loading Spinner (ซ่อนไว้เมื่ออยู่ในสถานะปกติ) -->
          <svg id="submitSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span id="submitText">บันทึกข้อมูล</span>
        </button>
      </form>
    </section>

    <!-- ส่วนแสดงรายการข้อมูลจากฐานข้อมูล Supabase -->
    <section class="bg-cardBg border border-borderSub rounded-xl p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-slate-800">รายการที่บันทึกไว้ใน Supabase</h2>
        <span id="taskCount" class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">0 รายการ</span>
      </div>

      <!-- พื้นที่แสดงรายการงาน -->
      <div id="taskList" class="space-y-2">
        <div class="text-center py-8 text-sm text-slate-400">กำลังเชื่อมต่อฐานข้อมูล...</div>
      </div>
    </section>

  </div>

  <!-- ========================================== -->
  <!-- ส่วนสคริปต์ควบคุมการทำงาน (JavaScript Logic) -->
  <!-- ========================================== -->
  <script>
    // 📌 จุดที่ต้องแก้: นำค่า Project URL และ anon public key จาก Supabase มาใส่ในเครื่องหมายคำพูดด้านล่างนี้
    const SUPABASE_URL = "https://bhzbbbwbgyczjkdzeycu.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_n-6PZyi2dlAhh68KleBwJw_N-tz6hPV";

    // สร้างตัวเชื่อมต่อกับฐานข้อมูล Supabase (ทำหน้าที่แทน SpreadsheetApp.openById)
    let supabaseClient = null;

    // ตั้งค่า Toast Notification มาตรฐานด้วย SweetAlert2
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 2500,
      timerProgressBar: true
    });

    // ทำงานทันทีเมื่อเปิดหน้าเว็บ (เหมือน window.onload ใน GAS)
    window.addEventListener('DOMContentLoaded', () => {
      // ตรวจสอบว่าผู้ใช้ใส่ URL และ Key หรือยัง
      if (SUPABASE_URL.includes("วาง_PROJECT_URL") || SUPABASE_ANON_KEY.includes("วาง_ANON")) {
        document.getElementById('taskList').innerHTML = `
          <div class="p-4 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-sm">
            <strong>⚠️ ยังไม่ได้ตั้งค่ากุญแจเชื่อมต่อ:</strong> กรุณานำค่า <code>SUPABASE_URL</code> และ <code>SUPABASE_ANON_KEY</code> จากหน้า Project Settings ใน Supabase มาใส่ในโค้ดก่อนครับ
          </div>
        `;
        return;
      }

      // เริ่มต้นเชื่อมต่อฐานข้อมูลและดึงข้อมูลมาแสดง
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      fetchTasks();
    });

    // ---------------------------------------------------------
    // 1. ฟังก์ชันดึงข้อมูลจากตาราง tasks (เทียบเท่าการอ่านแถวจากชีต)
    // ---------------------------------------------------------
    async function fetchTasks() {
      const listContainer = document.getElementById('taskList');
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('animate-spin');

      try {
        // คำสั่งดึงข้อมูลจากตาราง 'tasks' เรียงจากใหม่สุดไปเก่าสุด
        const { data, error } = await supabaseClient
          .from('tasks')
          .select('*')
          .order('created_at', { ascending: false });

        // หากฐานข้อมูลแจ้ง Error ให้โยนเข้าบล็อก catch ทันที
        if (error) throw error;

        // อัปเดตจำนวนรายการ
        document.getElementById('taskCount').textContent = `${data.length} รายการ`;

        // กรณีไม่มีข้อมูลในตาราง
        if (data.length === 0) {
          listContainer.innerHTML = `
            <div class="text-center py-8 border border-dashed border-borderSub rounded-lg text-sm text-slate-400">
              ยังไม่มีรายการงาน ลองพิมพ์ชื่องานด้านบนแล้วกดบันทึกได้เลยครับ
            </div>
          `;
          return;
        }

        // วาดรายการข้อมูลลงในการ์ด
        listContainer.innerHTML = data.map(item => {
          const dateStr = new Date(item.created_at).toLocaleString('th-TH', {
            dateStyle: 'medium',
            timeStyle: 'short'
          });

          return `
            <div class="flex items-center justify-between p-4 rounded-lg border border-borderSub bg-slate-50/50 hover:bg-slate-50 transition-all gap-4">
              <div class="min-w-0 flex-1">
                <p class="text-sm font-medium text-slate-800 break-words">${escapeHtml(item.title)}</p>
                <p class="text-xs text-slate-400 mt-1">บันทึกเมื่อ: ${dateStr} น.</p>
              </div>
              <button 
                onclick="handleDeleteTask(${item.id})" 
                class="h-10 px-3 rounded-lg border border-red-200 bg-red-50 hover:bg-danger hover:text-white active:bg-red-700 text-danger text-xs font-medium transition-all shrink-0"
              >
                ลบรายการ
              </button>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('เกิดข้อผิดพลาดในการดึงข้อมูล:', err);
        Swal.fire({
          icon: 'error',
          title: 'ดึงข้อมูลไม่สำเร็จ',
          text: err.message || 'กรุณาตรวจสอบการตั้งค่าตาราง tasks และการปิด RLS ใน Supabase',
          confirmButtonColor: '#2563EB'
        });
      } finally {
        refreshIcon.classList.remove('animate-spin');
      }
    }

    // ---------------------------------------------------------
    // 2. ฟังก์ชันบันทึกข้อมูลใหม่ (เทียบเท่า sheet.appendRow ใน GAS)
    // ---------------------------------------------------------
    async function handleAddTask(event) {
      event.preventDefault(); // ป้องกันหน้าเว็บกระพริบรีเฟรช

      const inputEl = document.getElementById('taskInput');
      const titleText = inputEl.value.trim();

      // ตรวจสอบว่ากรอกข้อมูลหรือยัง
      if (!titleText) {
        Swal.fire({
          icon: 'warning',
          title: 'กรุณากรอกข้อมูล',
          text: 'โปรดระบุชื่องานก่อนกดปุ่มบันทึกครับ',
          confirmButtonColor: '#F59E0B'
        });
        return;
      }

      // เปิดสถานะกำลังโหลด (Loading State) เพื่อป้องกันการกดปุ่มซ้ำ
      setButtonLoading(true);

      try {
        // คำสั่งเพิ่มแถวใหม่ลงในตาราง 'tasks'
        const { error } = await supabaseClient
          .from('tasks')
          .insert([{ title: titleText }]);

        if (error) throw error;

        // ล้างช่องกรอกข้อมูลและแจ้งเตือนสำเร็จสีเขียว (#10B981)
        inputEl.value = '';
        Toast.fire({
          icon: 'success',
          title: 'บันทึกข้อมูลเรียบร้อยแล้ว'
        });

        // ดึงข้อมูลใหม่มาแสดงทันทีโดยไม่ต้องรีเฟรชหน้า
        await fetchTasks();

      } catch (err) {
        console.error('เกิดข้อผิดพลาดในการบันทึก:', err);
        Swal.fire({
          icon: 'error',
          title: 'บันทึกข้อมูลไม่สำเร็จ',
          text: err.message,
          confirmButtonColor: '#EF4444'
        });
      } finally {
        // คืนค่าปุ่มกลับมาสถานะปกติเสมอไม่ว่าจะสำเร็จหรือพัง
        setButtonLoading(false);
      }
    }

    // ---------------------------------------------------------
    // 3. ฟังก์ชันลบข้อมูลตาม ID (เทียบเท่า sheet.deleteRow ใน GAS)
    // ---------------------------------------------------------
    async function handleDeleteTask(taskId) {
      // ถามยืนยันก่อนลบด้วย SweetAlert2
      const confirmResult = await Swal.fire({
        title: 'ยืนยันการลบรายการ?',
        text: 'เมื่อลบแล้วจะไม่สามารถกู้คืนข้อมูลนี้ได้',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#EF4444',
        cancelButtonColor: '#64748B',
        confirmButtonText: 'ใช่, ลบเลย',
        cancelButtonText: 'ยกเลิก'
      });

      if (!confirmResult.isConfirmed) return;

      try {
        const { error } = await supabaseClient
          .from('tasks')
          .delete()
          .eq('id', taskId);

        if (error) throw error;

        Toast.fire({
          icon: 'success',
          title: 'ลบรายการสำเร็จ'
        });

        await fetchTasks();

      } catch (err) {
        console.error('เกิดข้อผิดพลาดในการลบ:', err);
        Swal.fire({
          icon: 'error',
          title: 'ลบข้อมูลไม่สำเร็จ',
          text: err.message,
          confirmButtonColor: '#EF4444'
        });
      }
    }

    // ฟังก์ชันช่วยจัดการสถานะปุ่ม Loading Spinner
    function setButtonLoading(isLoading) {
      const btn = document.getElementById('btnSubmit');
      const spinner = document.getElementById('submitSpinner');
      const text = document.getElementById('submitText');

      btn.disabled = isLoading;
      if (isLoading) {
        spinner.classList.remove('hidden');
        text.textContent = 'กำลังบันทึก...';
      } else {
        spinner.classList.add('hidden');
        text.textContent = 'บันทึกข้อมูล';
      }
    }

    // ฟังก์ชันป้องกันการแทรกโค้ดแปลกปลอม (XSS Protection)
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
